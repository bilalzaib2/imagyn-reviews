# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "8f84af74377630a28899e60d2a32b753"
name = "imagyn-reviews"
application_url = "https://app.imagyn.co"
embedded = true

[build]
automatically_update_urls_on_dev = true

[app_proxy]
url = "https://app.imagyn.co/api/reviews"
subpath = "reviews"
prefix = "apps"

[webhooks]
# Matches ApiVersion.July26 in app/shopify.server.ts — the newest version the installed
# @shopify/shopify-api SDK actually supports today. This was previously set to "2026-10",
# a version Shopify's platform already accepts but that doesn't exist in this SDK's
# ApiVersion enum yet, meaning webhook payloads could be shaped differently than what the
# app's own GraphQL client (and any code that parses a webhook body) expects. Bump both
# together once the SDK is upgraded to a version that includes October26.
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  # Keeps Store.plan/planStatus in sync when a subscription changes outside the app's own
  # billing page (trial ending, payment declined, merchant cancels from Shopify's own
  # subscription screen). See app/services/billing/billing.server.ts's syncBillingFromShopify.
  [[webhooks.subscriptions]]
  uri = "/webhooks/app_subscriptions/update"
  topics = [ "app_subscriptions/update" ]

  # Mandatory GDPR compliance webhooks, required for every public Shopify app regardless of
  # what data it stores. Shopify requires all three compliance topics on a single
  # subscription block sharing one uri (compliance_topics, not topics) — see
  # app/routes/webhooks.compliance.tsx, which dispatches on the topic Shopify sends.
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

# fulfillments/create is intentionally NOT subscribed here. Shopify rejected deployment with
# "This app is not approved to subscribe to webhook topics containing protected customer
# data" — the topic's payload (destination address, customer email) requires completing
# Shopify's Protected Customer Data approval first (https://shopify.dev/docs/apps/launch/
# protected-customer-data), which this app has not done. The handler
# (app/routes/webhooks.fulfillments.create.tsx), scope, and Settings UI all still exist and
# are gated off by ORDER_AUTOMATION_ENABLED (app/config/features.server.ts) — re-add the
# subscription and scope below, and flip that flag, once approval is granted. See
# docs/DECISIONS.md.
#
#   [[webhooks.subscriptions]]
#   uri = "/webhooks/fulfillments/create"
#   topics = [ "fulfillments/create" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_orders/read_customers power the real Shopify order/customer data layer used by both
# the manual Send Request picker and (once ORDER_AUTOMATION_ENABLED flips on) the automatic
# request engine — see app/services/shopifyOrders.server.ts. On a live (non-development)
# store, Shopify restricts the actual protected fields (customer name/email/address) these
# scopes can return until Protected Customer Data approval is granted; every read through
# that service handles a null/redacted field rather than assuming it's always present.
# read_fulfillments (required specifically for the fulfillments/create WEBHOOK SUBSCRIPTION,
# a separate approval-gated concern from the two scopes above) is still deliberately not
# requested — see the comment above; add it back alongside the webhook subscription once that
# approval is granted.
scopes = "write_products,write_metaobjects,write_metaobject_definitions,write_files,read_files,read_orders,read_customers"

[auth]
redirect_urls = [
  "https://app.imagyn.co/auth/callback",
  "https://app.imagyn.co/auth/shopify/callback",
  "https://app.imagyn.co/api/auth/callback"
]

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

# Written by app/services/structuredData/sync.server.ts (namespace "$app", key
# "reviews_jsonld" — verified against shopify.dev that TOML's [product.metafields.app.*]
# maps to the literal "$app" GraphQL namespace, not "app") whenever a product's approved
# review data changes. Read directly by extensions/imagyn-review-widgets/blocks/
# star_rating.liquid to render a server-side JSON-LD <script> tag with zero extra
# request. storefront = "public_read" is required for Liquid to see it at all.
[product.metafields.app.reviews_jsonld]
type = "json"
name = "Reviews Structured Data"
description = "Server-synced schema.org Product/AggregateRating/Review JSON-LD for search engine rich snippets. Written by the app; never edited by merchants."

  [product.metafields.app.reviews_jsonld.access]
  admin = "merchant_read"
  storefront = "public_read"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"
